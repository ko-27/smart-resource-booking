<!DOCTYPE html>
<html>
<head>
    <title>Edit Resource</title>
</head>
<body>

<h1>Edit Resource</h1>

{% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
        <p>{{ message }}</p>
    {% endfor %}
{% endwith %}

<form method="POST">

    <label>Resource Name:</label><br>

    <input
        type="text"
        name="name"
        value="{{ resource.name }}"
        required
    >

    <br><br>

    <label>Resource Type:</label><br>

    <select name="resource_type" required>

        <option value="LAB"
            {% if resource.resource_type == "LAB" %}
                selected
            {% endif %}>
            Laboratory
        </option>

        <option value="HALL"
            {% if resource.resource_type == "HALL" %}
                selected
            {% endif %}>
            Seminar Hall
        </option>

        <option value="ROOM"
            {% if resource.resource_type == "ROOM" %}
                selected
            {% endif %}>
            Meeting Room
        </option>

        <option value="EQUIPMENT"
            {% if resource.resource_type == "EQUIPMENT" %}
                selected
            {% endif %}>
            Equipment
        </option>

        <option value="CLASSROOM"
            {% if resource.resource_type == "CLASSROOM" %}
                selected
            {% endif %}>
            Classroom
        </option>

    </select>

    <br><br>

    <label>Description:</label><br>

    <textarea
        name="description"
        rows="4"
        cols="40"
    >{{ resource.description or "" }}</textarea>

    <br><br>

    <label>Location:</label><br>

    <input
        type="text"
        name="location"
        value="{{ resource.location }}"
        required
    >

    <br><br>

    <label>Capacity:</label><br>

    <input
        type="number"
        name="capacity"
        value="{{ resource.capacity }}"
        min="1"
        required
    >

    <br><br>

    <label>Status:</label><br>

    <select name="status" required>

        <option value="AVAILABLE"
            {% if resource.status == "AVAILABLE" %}
                selected
            {% endif %}>
            Available
        </option>

        <option value="UNAVAILABLE"
            {% if resource.status == "UNAVAILABLE" %}
                selected
            {% endif %}>
            Unavailable
        </option>

        <option value="MAINTENANCE"
            {% if resource.status == "MAINTENANCE" %}
                selected
            {% endif %}>
            Maintenance
        </option>

    </select>

    <br><br>

    <button type="submit">
        Update Resource
    </button>

</form>

<p>
    <a href="{{ url_for('resources.list_resources') }}">
        Back to Resources
    </a>
</p>

</body>
</html>
