<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - Smart Resource Booking</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css', v='4') }}">

</head>


<body class="auth-page">

<div class="auth-wrapper">


    <div class="auth-logo">

        <h1>Smart Resource Booking</h1>

        <p>
            Create your institutional account
        </p>

    </div>


    <div class="auth-card">

        <h2>Create Account</h2>


        {% with messages = get_flashed_messages(with_categories=true) %}

            {% if messages %}

                <div class="flash-container">

                    {% for category, message in messages %}

                        <div class="flash flash-{{ category }}">
                            {{ message }}
                        </div>

                    {% endfor %}

                </div>

            {% endif %}

        {% endwith %}


        <form method="POST">


            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="department">
                    Department
                </label>

                <input
                    type="text"
                    id="department"
                    name="department"
                    placeholder="Example: IT"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    required
                >

            </div>


            <button type="submit"
                    class="btn"
                    style="width:100%;">

                Create Account

            </button>

        </form>


        <div class="auth-footer">

            Already have an account?

            <a href="{{ url_for('auth.login') }}">
                Login
            </a>

        </div>

    </div>

</div>


<script src="{{ url_for('static', filename='js/main.js') }}"></script>

</body>

</html>
